[project]
name = "sofias-sdk-lite"
version = "0.2.0"
description = "Build agents on the Sofias agent graph and run them over RabbitMQ."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Sofias-SDK-Lite"
license-files = ["LICENSE"]
authors = [{ name = "Sofias Tech, S.L.", email = "support@sofias.ai" }]
keywords = ["agents", "ai", "llm", "rabbitmq", "sofias"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "aio-pika>=9.0.0",
    "rstream>=1.0.0",
    "nh3>=0.3.6",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://sofias.ai/"
Documentation = "https://docs.sofias.ai/"
Repository = "https://github.com/Sofias-ai/sofias-sdk-lite"
Changelog = "https://github.com/Sofias-ai/sofias-sdk-lite/blob/main/CHANGELOG.md"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0",
]
docs = [
    # MkDocs 2.0 drops the plugin system this site relies on.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "pyright>=1.1.408",
    # Exercise the optional OpenTelemetry path (the `[otel]` extra) in tests.
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["integration: requires a running RabbitMQ broker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
